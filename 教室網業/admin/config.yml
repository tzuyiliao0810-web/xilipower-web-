backend:
  name: git-gateway
  branch: main

# 後台上傳的圖片會存到這裡
media_folder: "教室網業/images/uploads"
public_folder: "/images/uploads"

# 讓後台介面顯示中文
locale: "zh_Hant"

# 存檔時直接發布(小型網站不需要草稿審核流程)
publish_mode: simple

collections:
  - name: "settings"
    label: "網站內容"
    editor:
      preview: false
    files:
      - name: "content"
        label: "全站內容(所有區塊)"
        file: "教室網業/content.json"
        format: "json"
        fields:
          # ── 品牌 / 導覽列 ──
          - label: "① 品牌與導覽列"
            name: "brand"
            widget: "object"
            fields:
              - { label: "館名(Logo 文字)", name: "name", widget: "string" }
              - { label: "右上角按鈕文字", name: "cta_text", widget: "string", default: "立即體驗" }

          # ── 主視覺 ──
          - label: "② 主視覺(首頁大圖)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "上方英文標語", name: "eyebrow", widget: "string" }
              - { label: "大標題", name: "title", widget: "string" }
              - { label: "副標說明", name: "subtitle", widget: "text" }
              - { label: "背景圖片", name: "bg_image", widget: "image" }
              - { label: "主按鈕文字", name: "primary_btn_text", widget: "string", default: "立即體驗" }
              - { label: "次按鈕文字", name: "secondary_btn_text", widget: "string", default: "觀看課程影片" }

          # ── 課程影片 ──
          - label: "③ 課程影片"
            name: "videos"
            widget: "object"
            fields:
              - { label: "區塊英文標籤", name: "eyebrow", widget: "string", default: "TRAINING VIDEOS" }
              - { label: "區塊標題", name: "title", widget: "string" }
              - { label: "區塊副標", name: "subtitle", widget: "string" }
              - { label: "下方備註(可留空)", name: "footnote", widget: "string", required: false }
              - label: "影片卡片(可新增 / 刪除 / 拖曳排序)"
                name: "items"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - label: "類型"
                    name: "type"
                    widget: "select"
                    default: "image"
                    options:
                      - { label: "只顯示圖片(不能播放)", value: "image" }
                      - { label: "YouTube 影片(點擊播放)", value: "youtube" }
                      - { label: "Instagram 貼文(自動嵌入)", value: "instagram" }
                  - { label: "影片網址(YouTube 連結或 IG 貼文網址)", name: "url", widget: "string", required: false, hint: "類型選 YouTube 或 Instagram 時填。圖片類型可留空。" }
                  - { label: "縮圖 / 圖片", name: "thumb", widget: "image", required: false, hint: "圖片類型與 YouTube 類型可上傳縮圖;IG 類型不需要。" }
                  - { label: "標題", name: "title", widget: "string" }
                  - { label: "說明文字", name: "desc", widget: "string", required: false }

          # ── 課程方案 ──
          - label: "④ 課程方案 / 價目表"
            name: "pricing"
            widget: "object"
            fields:
              - { label: "區塊英文標籤", name: "eyebrow", widget: "string", default: "PRICING" }
              - { label: "區塊標題", name: "title", widget: "string" }
              - { label: "區塊副標", name: "subtitle", widget: "string" }
              - label: "方案(可新增 / 刪除 / 拖曳排序)"
                name: "plans"
                widget: "list"
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { label: "方案名稱", name: "name", widget: "string" }
                  - { label: "價格", name: "price", widget: "string", hint: "例如 NT$ 3,600" }
                  - { label: "單位", name: "unit", widget: "string", hint: "例如 ／月、／單堂" }
                  - label: "特色條列(可新增多項)"
                    name: "features"
                    widget: "list"
                    field: { label: "項目", name: "item", widget: "string" }
                  - { label: "標記為熱門方案(會加紅框)", name: "popular", widget: "boolean", default: false }
                  - { label: "按鈕文字", name: "btn_text", widget: "string", default: "我要報名" }

          # ── 館長介紹 ──
          - label: "⑤ 館長介紹"
            name: "coach"
            widget: "object"
            fields:
              - { label: "區塊英文標籤", name: "eyebrow", widget: "string", default: "THE FOUNDER" }
              - { label: "區塊標題", name: "title", widget: "string", default: "館長介紹" }
              - { label: "館長照片", name: "photo", widget: "image" }
              - { label: "姓名", name: "name", widget: "string" }
              - { label: "職稱", name: "role", widget: "string" }
              - { label: "介紹文字", name: "bio", widget: "text" }
              - label: "專長標籤"
                name: "tags"
                widget: "list"
                field: { label: "標籤", name: "tag", widget: "string" }

          # ── 常見問題 ──
          - label: "⑥ 常見問題 FAQ"
            name: "faq"
            widget: "object"
            fields:
              - { label: "區塊英文標籤", name: "eyebrow", widget: "string", default: "FAQ" }
              - { label: "區塊標題", name: "title", widget: "string", default: "常見問題" }
              - { label: "區塊副標", name: "subtitle", widget: "string" }
              - label: "問答(可新增 / 刪除 / 拖曳排序)"
                name: "items"
                widget: "list"
                summary: "{{fields.q}}"
                fields:
                  - { label: "問題", name: "q", widget: "string" }
                  - { label: "答案", name: "a", widget: "text" }

          # ── 地址聯絡 ──
          - label: "⑦ 地址與聯絡資訊"
            name: "contact"
            widget: "object"
            fields:
              - { label: "區塊英文標籤", name: "eyebrow", widget: "string", default: "VISIT US" }
              - { label: "區塊標題", name: "title", widget: "string", default: "教室地址資訊" }
              - { label: "地址", name: "address", widget: "string" }
              - { label: "Google 地圖嵌入網址(可留空)", name: "map_embed", widget: "string", required: false, hint: "Google 地圖 → 分享 → 嵌入地圖 → 複製 iframe 裡的 src 網址貼上。留空則顯示示意圖。" }
              - { label: "電話", name: "phone", widget: "string" }
              - { label: "營業時間", name: "hours", widget: "string" }
              - { label: "Instagram 顯示帳號", name: "instagram_handle", widget: "string" }
              - { label: "Instagram 連結", name: "instagram_link", widget: "string" }
              - { label: "LINE ID", name: "line_id", widget: "string" }
              - { label: "LINE 連結", name: "line_link", widget: "string", required: false }

          # ── 頁尾 ──
          - label: "⑧ 頁尾"
            name: "footer"
            widget: "object"
            fields:
              - { label: "版權文字", name: "copyright", widget: "string" }
